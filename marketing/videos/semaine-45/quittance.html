<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../kit.css"></head><body>
<script src="quittance.data.js"></script><script src="../kit.js"></script>
<script>
window.DURATION = 25.6
const receipt = (t, t0) => { const p = clamp((t - t0) / .5); return `<div style="background:${C.white};border:${OUT};border-radius:30px;box-shadow:${SH(14)};padding:40px 46px;transform:translateY(${(1 - back(p)) * 300}px) rotate(-2deg);opacity:${clamp(p * 3)}">
  <div style="font-family:Fraunces;font-weight:800;font-size:76px">Quittance</div><div style="font-size:36px;font-weight:800;margin:6px 0 26px">Novembre 2026</div>
  ${[['Loyer', '700,00 €', W('loyer', 2)], ['Charges', '50,00 €', W('charges.')]].map(([k, v, s]) => `<div style="display:flex;justify-content:space-between;font-size:52px;font-weight:900;padding:16px 0;border-top:4px dashed ${C.night};background:${t > s && t < s + 1 ? C.peach : 'transparent'}"><span>${k}</span><span>${v}</span></div>`).join('')}
  <div style="display:flex;justify-content:space-between;font-size:52px;font-weight:900;padding:16px 0;border-top:6px solid ${C.night}"><span>Payé</span><span style="color:${C.green}">750,00 €</span></div></div>` }
window.SCENES = [
  { start: 0, bg: C.orange, html: () => `<div class="abs" style="inset:0;background:${DOTS('rgba(15,31,61,.10)')}"></div>
      <div class="abs" id="a" style="left:60px;right:60px;top:240px"></div>
      <div class="abs" id="b" style="left:0;right:0;top:820px;text-align:center"></div>`,
    update(lt, t) {
      $('a').innerHTML = slam('Une quittance\u00a0?', .05, t, { size: 160, color: C.white, stroke: true })
      $('b').innerHTML = `${sticker('Vous devez la donner', { bg: C.white, size: 76, rot: -2, t0: W('devez'), t })}<div style="margin-top:50px">${sticker('GRATUITEMENT !', { bg: C.night, color: C.white, size: 110, rot: 4, t0: W('gratuitement'), t, shadow: 16 })}</div>`
    } },
  { start: W('la', 2) - .3, bg: C.sky, burst: C.blue, html: () => `<div class="abs" style="inset:0;background:${DOTS('rgba(31,67,150,.12)')}"></div>
      <div class="abs" id="a" style="left:60px;right:60px;top:200px"></div>
      <div class="abs" id="b" style="left:110px;right:110px;top:560px"></div>`,
    update(lt, t) {
      $('a').innerHTML = slam('Le reçu du loyer payé', this.start + .15, t, { size: 120, color: C.blue })
      $('b').innerHTML = receipt(t, W('reçu'))
    } },
  { start: W('par') - .3, bg: C.blue, burst: C.blue, html: () => `<div class="abs" style="inset:0;background:${DOTS('rgba(255,255,255,.10)')}"></div>
      <div class="abs" id="a" style="left:60px;right:60px;top:280px"></div>
      <div class="abs" id="b" style="left:0;right:0;top:720px;text-align:center"></div>`,
    update(lt, t) {
      $('a').innerHTML = slam('Par email\u00a0?', this.start + .1, t, { size: 160, color: C.white, stroke: true })
      $('b').innerHTML = `${sticker('OUI', { bg: C.mint, size: 160, rot: -5, pad: '6px 70px', t0: W('oui'), t, shadow: 16 })}<div style="margin-top:50px">${sticker('si votre locataire est d’accord', { bg: C.white, size: 60, rot: 2, t0: W('daccord') - .3, t })}</div>`
    } },
  { start: W('zéro') - .35, bg: C.cream, burst: C.orange, html: () => `
      <div class="abs" id="a" style="left:0;right:0;top:260px;text-align:center"></div>
      <div class="abs" id="b" style="left:80px;right:80px;top:760px"></div>`,
    update(lt, t) {
      $('a').innerHTML = `<div style="font-family:Fraunces;font-weight:800;font-size:320px;line-height:1;transform:scale(${lerp(2, 1, back((t - W('zéro')) / .35))});opacity:${clamp((t - W('zéro')) * 5)}">0 €</div><div style="margin-top:20px">${sticker('de frais', { bg: C.orange, size: 80, rot: -3, t0: W('frais'), t })}</div>`
      $('b').innerHTML = [['Timbre', W('timbre')], ['Frais de gestion', W('gestion.') - .2]].map(([x, t0], k) => `<div style="margin-top:40px;text-align:${k ? 'right' : 'left'}">${sticker('✗ ' + x, { bg: C.white, size: 70, rot: k ? 2 : -2, t0, t })}</div>`).join('')
    } },
  { start: W('astuce') - .3, bg: C.night, burst: C.orange, html: () => `<div class="abs" style="inset:0;background:${DOTS('rgba(255,255,255,.07)')}"></div>
      <div class="abs" id="a" style="left:0;right:0;top:240px;text-align:center"></div>
      <div class="abs" id="b" style="left:0;right:0;top:640px;text-align:center"></div>`,
    update(lt, t) {
      $('a').innerHTML = sticker('Astuce', { bg: C.orange, size: 110, rot: -4, t0: W('astuce'), t, shadow: 16 })
      const p = (t - W('part')) / .7
      $('b').innerHTML = `<div style="display:inline-block;transform:translate(${eo(clamp(p)) * 120}px,${-eo(clamp(p)) * 60}px) rotate(${-8 + eo(clamp(p)) * 8}deg);opacity:${clamp((t - W('quittance', 3)) * 4)}"><svg width="300" height="220" viewBox="0 0 30 22"><rect x="1" y="1" width="28" height="20" rx="3" fill="#fff" stroke="${C.night}" stroke-width="1.4"/><path d="M2 3l13 9 13-9" fill="none" stroke="${C.night}" stroke-width="1.4"/></svg></div>
        <div style="margin-top:40px">${sticker('La quittance part toute seule', { bg: C.white, size: 64, rot: -2, t0: W('toute'), t })}</div>
        <div style="margin-top:30px">${sticker('dès que le loyer est enregistré', { bg: C.sky, size: 56, rot: 2, t0: W('enregistré.') - .3, t })}</div>`
    } },
  endScene(W('abonnez-vous'), W('guide'), 'Source : loi du 6 juillet 1989, art. 21 (notice officielle du bail)'),
]
</script></body></html>
