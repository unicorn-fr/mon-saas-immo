<!doctype html>
<html lang="fr" data-resolution="custom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1a1a2e; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Miniatures Bailio : une image par seconde (presentation, rapide, vide, lundi). Généré par scripts/miniatures.py. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="mc-presentation" data-composition-id="mc-presentation" data-composition-src="compositions/mc-presentation.html" data-start="0" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="mc-rapide" data-composition-id="mc-rapide" data-composition-src="compositions/mc-rapide.html" data-start="1" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="mc-vide" data-composition-id="mc-vide" data-composition-src="compositions/mc-vide.html" data-start="2" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="mc-lundi" data-composition-id="mc-lundi" data-composition-src="compositions/mc-lundi.html" data-start="3" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
