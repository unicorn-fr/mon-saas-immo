<!doctype html>
<html lang="fr" data-resolution="custom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #1a1a2e; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Miniatures Bailio : une image par seconde (presentation, rapide, vide, lundi). Généré par scripts/miniatures.py. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="2560" data-height="1440">
      <div id="m-presentation" data-composition-id="m-presentation" data-composition-src="compositions/m-presentation.html" data-start="0" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="2560" data-height="1440"></div>
      <div id="m-rapide" data-composition-id="m-rapide" data-composition-src="compositions/m-rapide.html" data-start="1" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="2560" data-height="1440"></div>
      <div id="m-vide" data-composition-id="m-vide" data-composition-src="compositions/m-vide.html" data-start="2" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="2560" data-height="1440"></div>
      <div id="m-lundi" data-composition-id="m-lundi" data-composition-src="compositions/m-lundi.html" data-start="3" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="2560" data-height="1440"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
