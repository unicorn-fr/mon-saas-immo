  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Le point caramel du logo apparaît au centre, sur l'encre.
      tl.fromTo('#s3-dot', { x: 1280, y: 720, scale: 0 }, { scale: 1, duration: 0.3, ease: 'back.out(1.6)' }, 0.0);
