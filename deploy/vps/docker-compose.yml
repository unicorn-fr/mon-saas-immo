# Bailio : site + API + PostgreSQL + HTTPS sur un seul serveur (VPS Infomaniak).
# Lancement : docker compose up -d --build   (depuis ce dossier, avec un fichier .env rempli)
name: bailio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bailio
      POSTGRES_USER: bailio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Aucun port publié : la base n'est joignable que par l'API, sur le réseau interne.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bailio -d bailio"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://bailio:${POSTGRES_PASSWORD}@db:5432/bailio
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    # Caddy + le site, construits ensemble (deploy/vps/Dockerfile.caddy).
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.caddy
      args:
        VITE_SITE_URL: https://${SITE_DOMAIN:-bailio.eu}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN manquant dans .env}
      SITE_DOMAIN: ${SITE_DOMAIN:-bailio.eu}
      SITE_REDIRECT_DOMAINS: ${SITE_REDIRECT_DOMAINS:-www.bailio.eu}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
