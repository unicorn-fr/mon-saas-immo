# Vérifications à chaque push et pull request. Sur main, si tout passe, la branche « production »
# est avancée : c'est elle que le serveur suit (deploy/vps/auto-update.sh). Une version en erreur
# n'est donc jamais mise en ligne automatiquement.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, tests et construction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Outils de lecture des baux (OCR)
        run: sudo apt-get update -q && sudo apt-get install -yq tesseract-ocr tesseract-ocr-fra poppler-utils
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Failles connues dans les dépendances
        run: npm audit --prefix server --omit=dev --audit-level=high && npm audit --prefix client --omit=dev --audit-level=high
      - name: Types (serveur et site)
        run: npm run typecheck
      - name: Tests (règles juridiques, OCR, site)
        run: npm test
      - name: Construction
        run: npm run build
      - name: Configuration du serveur (Docker Compose et Caddy, avec et sans la publication sur les réseaux)
        working-directory: deploy/vps
        run: |
          printf 'API_DOMAIN=api.bailio.eu\nPOSTGRES_PASSWORD=essai\n' > .env
          docker compose config -q
          COMPOSE_PROFILES=reseaux docker compose config -q
          rm .env
          caddy_check() {
            docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$1:/etc/caddy/sites:ro" \
              -e SITE_DOMAIN=bailio.fr -e "SITE_REDIRECT_DOMAINS=www.bailio.fr, bailio.eu, www.bailio.eu" -e API_DOMAIN=api.bailio.eu \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          caddy_check "$PWD/sites"
          mkdir -p "$RUNNER_TEMP/sites"
          ./reseaux.sh --print-site reseaux.bailio.fr "$(docker run --rm caddy:2-alpine caddy hash-password --plaintext essai)" > "$RUNNER_TEMP/sites/reseaux.caddy"
          caddy_check "$RUNNER_TEMP/sites"
      - name: Image de l'API (démarre et répond, sans droits d'administrateur, avec les outils de lecture des PDF)
        run: |
          docker build -q -t bailio-api .
          docker network create essai
          docker run -d --name db --network essai -e POSTGRES_USER=bailio -e POSTGRES_PASSWORD=essai -e POSTGRES_DB=bailio postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U bailio -d bailio >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name api --network essai -e DATABASE_URL=postgresql://bailio:essai@db:5432/bailio bailio-api
          ok=0
          for i in $(seq 1 60); do
            if docker exec api node -e "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs api 2>&1 | tail -20
          [ "$ok" = 1 ] || { echo "L'API ne démarre pas"; exit 1; }
          [ "$(docker exec api id -u)" != "0" ] || { echo "L'API tourne en administrateur"; exit 1; }
          docker exec api sh -c 'tesseract --list-langs 2>&1 | grep -q fra && pdftoppm -v >/dev/null 2>&1 && pdfinfo -v >/dev/null 2>&1'
          docker exec api node -e "const fs=require('fs'),os=require('os'),p=fs.mkdtempSync(os.tmpdir()+'/essai-');fs.writeFileSync(p+'/x','1')"

  e2e:
    name: Parcours complets (navigateur)
    # Playwright ne prend pas encore en charge Ubuntu 26.04 (« ubuntu-latest » depuis octobre 2026) : version figée.
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bailio
          POSTGRES_PASSWORD: bailio
          POSTGRES_DB: bailio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bailio" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://bailio:bailio@localhost:5432/bailio
      E2E_API_LOG: /tmp/bailio-api.log
      RATE_LIMIT_SCALE: 20
      # Pilotage et mesure d'audience (e2e/tests/34-pilotage-avis.test.mjs) : l'API reconnaît cette adresse.
      ADMIN_EMAILS: pilotage-e2e@example.fr
      E2E_ADMIN_EMAIL: pilotage-e2e@example.fr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: Outils PDF (lecture des PDF dans les tests)
        run: sudo apt-get install -yq poppler-utils
      - name: Base de test
        working-directory: server
        run: npx prisma generate && npx prisma migrate deploy
      - name: API et site
        run: |
          (cd server && npx tsx src/server.ts > /tmp/bailio-api.log 2>&1 &)
          (cd client && npx vite --port 5173 > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:5000/health && curl -sf localhost:5173 >/dev/null && exit 0; sleep 2; done
          cat /tmp/bailio-api.log; exit 1
      - name: Parcours
        run: npm --prefix e2e test
      - name: Captures et journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-captures
          path: |
            e2e/captures/
            /tmp/bailio-api.log
            /tmp/vite.log

  production:
    name: Mise en production
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Avancer la branche production (suivie par le serveur)
        run: git push origin HEAD:refs/heads/production --force-with-lease
